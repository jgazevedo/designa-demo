<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DESIGNA!</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    #c { width: 100vw; height: 100vh; display: block; background: #fff; outline: none; }
    #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 28px; background: #000; color: #fff; font: 600 18px system-ui, sans-serif; }
    #load img { width: min(520px, 70vw); }
    #bar { width: min(420px, 70vw); height: 14px; border: 3px solid #fff; border-radius: 10px; }
    #fill { height: 100%; width: 0; background: #E9BC00; border-radius: 6px; transition: width .2s; }
    #msg { letter-spacing: .04em; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="-1"></canvas>
  <div id="load">
    <img src="logo.png" alt="DESIGNA!">
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Carregando…</div>
  </div>
  <script>
    // Endereço do servidor do modo online (wss://…/ws). Vazio = modo online desligado nesta página.
    // Em teste local (http://localhost) o jogo usa ws://localhost:5080/ws automaticamente.
    window.DESIGNA_SERVER = "";
  </script>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DESIGNA",
      productName: "DESIGNA!",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var fill = document.getElementById("fill");
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(document.getElementById("c"), config, function (p) {
        fill.style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("load").remove();
      }).catch(function (e) {
        document.getElementById("msg").textContent = "Não foi possível carregar o jogo: " + e;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
